[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-sdk"
version = "1.0.0"
description = "Warden SDK — programmatic trust verification for AI tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["warden_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
